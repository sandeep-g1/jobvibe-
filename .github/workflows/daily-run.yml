name: Daily job run

# Vercel Cron is the punctual trigger and dispatches this workflow at 08:00 IST.
# The schedule below is only a safety net for a day when that dispatch fails:
# GitHub's own scheduler has been running roughly 4.7 hours late, and the run
# step skips itself if today's run already happened.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: Verify database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:check

      - name: Refresh board registry (Mondays only)
        if: github.event.schedule == '30 2 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run seed

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: https://jobvibe-green.vercel.app
        run: npm run run -- ${{ github.event_name == 'schedule' && '--once-per-day' || '' }}
